<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Лёва — новое движение</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101e37;color:#fff1d4;font-family:Georgia,serif}.preview{position:relative;width:min(100vw,140vh);height:min(100vh,71.43vw);min-height:430px;overflow:hidden;background:linear-gradient(#10234066,#10234055),url('assets/library.png') center/cover;border:1px solid #b7cdd52b}.heading{position:absolute;left:15%;right:15%;top:3%;text-align:center;z-index:2}.heading h1{font-size:clamp(22px,3vw,38px);font-weight:500;margin:0 0 6px}.heading p{margin:0;font-size:clamp(13px,1.5vw,19px)}canvas{position:absolute;left:0;top:0;width:100%;height:100%}.controls{position:absolute;bottom:3%;left:0;right:0;display:flex;gap:12px;justify-content:center;z-index:2}button{padding:13px 24px;border:3px double #d8bc80;border-radius:24px;background:#173653;color:#fff1d4;font:600 17px Georgia;cursor:pointer;box-shadow:0 4px 18px #081a32aa}button:disabled{opacity:.6;cursor:default}button:focus-visible{outline:3px solid #fff4bf;outline-offset:4px}#status{position:absolute;bottom:14%;left:15%;right:15%;text-align:center;font-size:15px;min-height:20px}#error{padding:20px;background:#173653;position:absolute;top:40%;left:15%;right:15%;text-align:center}[hidden]{display:none!important}@media(max-width:600px){.preview{min-height:100svh}.heading{top:6%}button{font-size:14px;padding:11px 14px}.controls{bottom:5%}}
